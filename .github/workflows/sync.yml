name: sync-and-deploy
on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 BRT
    - cron: '17 21 * * *'  # 18:17 BRT
  push:
    branches: [main]
    paths: ['config/**', 'plan/**', 'scripts/**', 'site/**']
  workflow_dispatch:
    inputs:
      full:
        description: 'Full history backfill'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check plan
        run: node scripts/check.mjs
      # Raw Garmin data (GPS, HR…) never goes into the public repo: it lives in the Actions cache.
      - name: Restore raw data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: garmin-raw-${{ github.run_id }}
          restore-keys: garmin-raw-
      - name: Garmin sync
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          FULL=""
          if [ "${{ inputs.full }}" = "true" ] || [ ! -f data/raw/garmin/activities.json ]; then FULL="--full"; fi
          node scripts/sync-garmin.mjs $FULL
      - name: Save raw data
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: garmin-raw-${{ github.run_id }}
      - name: History summary (aggregates)
        if: github.ref != 'refs/heads/main'
        run: node scripts/history.mjs
      - name: Build site
        run: node scripts/build.mjs
      # Branch runs (workflow_dispatch on a branch) stop here: the built page is downloadable as a preview.
      - name: Upload preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: site-preview, path: dist, retention-days: 3 }
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
